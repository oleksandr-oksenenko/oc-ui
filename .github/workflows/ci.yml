name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tiers:
    name: ${{ matrix.name }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fast
            tier: fast
            command: pnpm check && pnpm exec vp run --no-cache -w test
            os: ubuntu-24.04
            arch: x64
          - name: Components
            tier: components
            command: pnpm exec vp run --no-cache -w build-storybook && pnpm exec vp run --no-cache -w test:components
            os: ubuntu-24.04
            arch: x64
          - name: Integration
            tier: integration
            command: pnpm exec vp run --no-cache -w test:integration
            os: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify toolchain and runner architecture
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          node --version
          pnpm --version
          echo "TMPDIR=${RUNNER_TEMP}/" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install server fixture prerequisites
        if: matrix.tier == 'integration' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh openssl

      - name: Install Chromium
        if: matrix.tier == 'components' || matrix.tier == 'integration'
        run: pnpm --filter desktop exec playwright install --with-deps chromium

      - name: Run tier
        run: ${{ matrix.command }}

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            command: xvfb-run -a dbus-run-session -- pnpm test:acceptance:linux
          - os: macos-15
            arch: arm64
            command: pnpm test:acceptance:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Acceptance uses the configured ad-hoc identity, without signing credentials.
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify toolchain and runner architecture
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          echo "TMPDIR=${RUNNER_TEMP}/" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Install Linux native fixture prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh openssl xvfb xauth dbus-x11 gnome-keyring libsecret-1-0 libsecret-tools libglib2.0-bin binutils libgtk-3-0t64 libnotify4
          pnpm --filter desktop exec playwright install-deps chromium
      - name: Run packaged acceptance
        run: ${{ matrix.command }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
